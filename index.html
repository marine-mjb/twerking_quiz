<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC105 · Database Systems & Normalization Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0f19;
            background-image: radial-gradient(circle at 15% 30%, #1e2a4a 0%, #0a0d14 90%);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }

        .quiz-shell {
            max-width: 900px;
            width: 100%;
            background: rgba(18, 24, 40, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 35px 55px -18px #000000cc,
                        0 0 0 1px #2e3b5e inset,
                        0 0 0 2px #0e121f inset;
            padding: 2.2rem 2.2rem 2rem;
            transition: 0.2s;
            border: 1px solid #2a3757;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .title-block h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #eef3ff;
            letter-spacing: -0.02em;
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: wrap;
        }

        .title-block h1 .badge {
            font-size: 0.85rem;
            background: #2b3f6e;
            color: #b7cbff;
            padding: 0.3rem 1.1rem;
            border-radius: 40px;
            font-weight: 500;
            border: 1px solid #3f5a94;
            letter-spacing: 0.2px;
        }

        .subtitle {
            color: #8e9fc3;
            font-size: 1rem;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            border-left: 4px solid #3a5c9e;
            padding-left: 1rem;
        }

        .subtitle .chip {
            background: #1e2c4a;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            color: #b0c4ee;
            font-size: 0.85rem;
            border: 1px solid #314b78;
        }

        /* stats row */
        .stats-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
            background: #0e1525;
            padding: 0.45rem 1rem 0.45rem 1.5rem;
            border-radius: 80px;
            border: 1px solid #263452;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            color: #b3c4e9;
        }

        .stat-item .value {
            background: #1f2b45;
            padding: 0.15rem 0.9rem;
            border-radius: 40px;
            font-weight: 700;
            color: #d9e3ff;
            border: 1px solid #3c5380;
        }

        .progress-track {
            background: #1b2338;
            height: 6px;
            border-radius: 10px;
            width: 140px;
            overflow: hidden;
            border: 1px solid #2d3b5e;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4f7fff, #a37bff);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* question cards */
        .question-grid {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin: 1.5rem 0 2rem;
        }

        .q-card {
            background: #121b2e;
            border-radius: 1.8rem;
            padding: 1.4rem 1.6rem 1.2rem;
            border: 1px solid #253352;
            box-shadow: 0 8px 18px -6px #00000060;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .q-card:hover {
            border-color: #3e5a94;
            box-shadow: 0 12px 24px -10px #2f4b8b60;
        }

        .q-header {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .q-index {
            background: #1f2e52;
            color: #a7bdf2;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.2rem 0.85rem;
            border-radius: 40px;
            border: 1px solid #34518b;
            letter-spacing: 0.3px;
        }

        .q-text {
            font-weight: 500;
            font-size: 1.08rem;
            color: #dce6ff;
            line-height: 1.5;
            flex: 1;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin: 0.9rem 0 0.2rem;
        }

        .opt-row {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            background: #0e1629;
            padding: 0.7rem 1.1rem;
            border-radius: 50px;
            border: 1px solid #20304e;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #c7d6f5;
            font-size: 0.98rem;
            font-weight: 450;
        }

        .opt-row:hover {
            background: #17223b;
            border-color: #3861b0;
        }

        .opt-row input[type="radio"] {
            appearance: none;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid #405e9e;
            border-radius: 50%;
            margin: 0;
            display: grid;
            place-content: center;
            transition: 0.08s;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
        }

        .opt-row input[type="radio"]:checked {
            border-color: #7b9eff;
            background: #1f3d7a;
            box-shadow: 0 0 0 2px #0b1424, 0 0 0 4px #3f62b0;
        }

        .opt-row input[type="radio"]:checked::before {
            content: "";
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background: #b9d0ff;
            display: block;
        }

        .opt-row:has(input:checked) {
            background: #1a2745;
            border-color: #5f83da;
            color: #eef4ff;
            box-shadow: 0 0 0 1px #3f62b080 inset;
        }

        /* per-question feedback */
        .q-feedback {
            min-height: 2rem;
            margin-top: 0.8rem;
            font-size: 0.92rem;
            font-weight: 500;
            padding-top: 0.2rem;
            color: #91a9dd;
        }

        .fb-correct {
            color: #84e6b0;
            background: #0e2a1e;
            padding: 0.25rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #2a7a4b;
        }

        .fb-wrong {
            color: #ffb0c0;
            background: #2e1420;
            padding: 0.25rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #a13f5a;
        }

        .fb-warning {
            color: #ffd966;
            background: #2d2712;
            padding: 0.25rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #9e8438;
        }

        /* actions bar */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 0.5rem;
            padding-top: 0.8rem;
            border-top: 1px solid #253352;
        }

        .btn-set {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
        }

        .btn {
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.75rem 1.8rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.12s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: #1b2742;
            color: #c4d2f0;
            border: 1px solid #2e4270;
            box-shadow: 0 4px 10px -4px #00000070;
        }

        .btn:hover {
            background: #233458;
            border-color: #4b6dbb;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #2a4a9e;
            color: white;
            border-color: #4f7aff;
            box-shadow: 0 8px 16px -6px #244090;
        }

        .btn-primary:hover {
            background: #3358b5;
            border-color: #7b9eff;
            box-shadow: 0 12px 20px -6px #244090d0;
        }

        .score-pill {
            background: #0b1222;
            border-radius: 60px;
            padding: 0.5rem 1.5rem 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            border: 1px solid #2f4270;
            box-shadow: 0 0 0 1px #0a0f1c;
        }

        .score-label {
            color: #8299c9;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-number {
            background: #1e2f58;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1.35rem;
            color: white;
            border: 1px solid #5173c2;
            min-width: 70px;
            text-align: center;
        }

        .footnote {
            text-align: center;
            margin-top: 1.5rem;
            color: #5c6f97;
            font-size: 0.85rem;
            letter-spacing: 0.2px;
            border-top: 1px dashed #253352;
            padding-top: 1.2rem;
        }

        @media (max-width: 520px) {
            .quiz-shell {
                padding: 1.5rem 1.2rem;
            }
            .title-block h1 {
                font-size: 1.5rem;
            }
            .stat-item .value {
                padding: 0.1rem 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-shell">
        <!-- header -->
        <div class="top-bar">
            <div class="title-block">
                <h1>
                    🗄️ Database Systems & Normalization
                    <span class="badge">CC105 · IM</span>
                </h1>
                <div class="subtitle">
                    <span>Quezon City University — College of Computer Studies</span>
                    <span class="chip">Module 1 & 2</span>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-item">
                    <span>📊 Progress</span>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <div class="stat-item">
                    <span>✅ Answered</span>
                    <span class="value" id="answeredCount">0</span>
                </div>
            </div>
        </div>

        <!-- questions injected here -->
        <form id="quizForm" onsubmit="return false;">
            <div class="question-grid" id="questionGrid"></div>
        </form>

        <!-- action bar -->
        <div class="action-bar">
            <div class="btn-set">
                <button class="btn btn-primary" id="submitBtn" type="button">📋 Submit & grade</button>
                <button class="btn" id="resetBtn" type="button">↻ Reset quiz</button>
            </div>
            <div class="score-pill">
                <span class="score-label">Score</span>
                <span class="score-number" id="scoreDisplay">0/12</span>
            </div>
        </div>

        <div class="footnote">
            ⚡ Based on Module 1 & 2 — Information Management, DBMS, file systems, relational model, and normalization (1NF–3NF)
        </div>
    </div>

    <script>
        (function() {
            // ---------- QUIZ DATA (CC105) ----------
            const questions = [
                {
                    question: "What is Information Management (IM) best described as?",
                    options: [
                        "A hardware system for storing files",
                        "An umbrella term for systems and processes managing corporate information as an asset",
                        "A programming language for databases",
                        "A type of network protocol"
                    ],
                    correct: 1
                },
                {
                    question: "Which of the following correctly distinguishes data from information?",
                    options: [
                        "Data is processed; information is raw facts",
                        "Data is raw unorganized facts; information is processed with context and meaning",
                        "Data and information are synonyms",
                        "Information is only numeric; data is only text"
                    ],
                    correct: 1
                },
                {
                    question: "Who designed the first computerized database in the 1960s?",
                    options: [
                        "Dr. E. F. Codd",
                        "Charles Bachman",
                        "Larry Ellison",
                        "Tim Berners-Lee"
                    ],
                    correct: 1
                },
                {
                    question: "In which decade did SQL become the standard database language?",
                    options: ["1960s", "1970s", "1980s", "1990s"],
                    correct: 2
                },
                {
                    question: "What major database paradigm emerged and grew during the 1990s?",
                    options: [
                        "Hierarchical databases",
                        "Object-Oriented Databases",
                        "Network databases",
                        "Flat-file systems"
                    ],
                    correct: 1
                },
                {
                    question: "Which is a disadvantage of traditional file systems?",
                    options: [
                        "Program-data independence",
                        "Minimal data redundancy",
                        "Program-data dependence",
                        "Easy data sharing"
                    ],
                    correct: 2
                },
                {
                    question: "What does DBMS stand for?",
                    options: [
                        "Database Management System",
                        "Data Binding Management Software",
                        "Digital Base Management System",
                        "Database Mining System"
                    ],
                    correct: 0
                },
                {
                    question: "Which normal form deals with eliminating partial dependencies?",
                    options: ["1NF", "2NF", "3NF", "BCNF"],
                    correct: 1
                },
                {
                    question: "What is the primary goal of normalization?",
                    options: [
                        "Increase data redundancy for faster queries",
                        "Reduce data redundancy and eliminate anomalies",
                        "Store all data in a single table",
                        "Remove all foreign keys"
                    ],
                    correct: 1
                },
                {
                    question: "A relation is in 1NF if:",
                    options: [
                        "It has no partial dependencies",
                        "All attributes are atomic and there are no repeating groups",
                        "It has no transitive dependencies",
                        "Every determinant is a candidate key"
                    ],
                    correct: 1
                },
                {
                    question: "In the 1970s, Dr. E. F. Codd introduced which model?",
                    options: [
                        "Network model",
                        "Hierarchical model",
                        "Relational model",
                        "Object-oriented model"
                    ],
                    correct: 2
                },
                {
                    question: "Which of the following is a characteristic of a database?",
                    options: [
                        "It is always stored in a single file",
                        "It represents real-world facts and is logically coherent",
                        "It cannot be shared among multiple users",
                        "It has no specific purpose"
                    ],
                    correct: 1
                }
            ];

            const totalQuestions = questions.length;
            let selectedAnswers = new Array(totalQuestions).fill(null);
            let submitted = false;

            // DOM elements
            const questionGrid = document.getElementById('questionGrid');
            const submitBtn = document.getElementById('submitBtn');
            const resetBtn = document.getElementById('resetBtn');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const answeredCountSpan = document.getElementById('answeredCount');
            const progressFill = document.getElementById('progressFill');

            // ---------- RENDER ----------
            function renderQuestions() {
                let html = '';
                questions.forEach((q, idx) => {
                    const qNum = idx + 1;
                    const optionsHtml = q.options.map((opt, optIdx) => {
                        const radioId = `q${idx}_opt${optIdx}`;
                        const checked = (selectedAnswers[idx] === optIdx);
                        return `
                            <label class="opt-row" for="${radioId}">
                                <input type="radio" id="${radioId}" name="question${idx}" value="${optIdx}"
                                    ${checked ? 'checked' : ''}
                                    data-qidx="${idx}" data-optidx="${optIdx}">
                                <span>${opt}</span>
                            </label>
                        `;
                    }).join('');

                    html += `
                        <div class="q-card" data-qidx="${idx}">
                            <div class="q-header">
                                <span class="q-index">Q${qNum}</span>
                                <span class="q-text">${q.question}</span>
                            </div>
                            <div class="options-grid">
                                ${optionsHtml}
                            </div>
                            <div class="q-feedback" id="feedback-${idx}"></div>
                        </div>
                    `;
                });
                questionGrid.innerHTML = html;

                // Attach change listeners
                document.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.addEventListener('change', function() {
                        const qIdx = parseInt(this.dataset.qidx);
                        const optIdx = parseInt(this.dataset.optidx);
                        selectedAnswers[qIdx] = optIdx;
                        updateProgressAndCount();
                        if (submitted) {
                            submitted = false; // reset submitted flag when user changes answer
                            clearAllFeedback();
                            // also reset score display to "--" or keep but we update on next submit
                            // We'll keep the score as is but grey it? better to set to '0/12'? 
                            // I'll set to '—/12' to indicate not graded
                            scoreDisplay.textContent = `—/${totalQuestions}`;
                        }
                    });
                });
            }

            // ---------- UI UPDATES ----------
            function updateProgressAndCount() {
                const answered = selectedAnswers.filter(a => a !== null).length;
                answeredCountSpan.textContent = answered;
                const percent = (answered / totalQuestions) * 100;
                progressFill.style.width = percent + '%';
            }

            function clearAllFeedback() {
                document.querySelectorAll('.q-feedback').forEach(el => el.innerHTML = '');
            }

            // ---------- SUBMIT ----------
            function handleSubmit() {
                let score = 0;
                clearAllFeedback();

                questions.forEach((q, idx) => {
                    const selected = selectedAnswers[idx];
                    const feedbackDiv = document.getElementById(`feedback-${idx}`);
                    if (selected === null) {
                        feedbackDiv.innerHTML = `<span class="fb-warning">⚠️ Not answered</span>`;
                        return;
                    }
                    const isCorrect = (selected === q.correct);
                    if (isCorrect) {
                        score++;
                        feedbackDiv.innerHTML = `<span class="fb-correct">✓ Correct! ${q.options[q.correct]}</span>`;
                    } else {
                        feedbackDiv.innerHTML = `<span class="fb-wrong">✗ Incorrect. Correct: ${q.options[q.correct]}</span>`;
                    }
                });

                scoreDisplay.textContent = `${score}/${totalQuestions}`;
                submitted = true;
                updateProgressAndCount();
            }

            // ---------- RESET ----------
            function resetQuiz() {
                selectedAnswers = new Array(totalQuestions).fill(null);
                document.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.checked = false;
                });
                clearAllFeedback();
                scoreDisplay.textContent = `0/${totalQuestions}`;
                submitted = false;
                updateProgressAndCount();
            }

            // ---------- INIT ----------
            renderQuestions();
            updateProgressAndCount();
            scoreDisplay.textContent = `0/${totalQuestions}`;

            submitBtn.addEventListener('click', handleSubmit);
            resetBtn.addEventListener('click', resetQuiz);
        })();
    </script>
</body>
</html>
