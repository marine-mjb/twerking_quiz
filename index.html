<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF101: Object Oriented Programming Study Guide</title>
    <style>
        /* --- CSS Variables & Reset --- */
        :root {
            --primary: #1a5276;
            --primary-light: #2980b9;
            --secondary: #e67e22;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --correct: #27ae60;
            --wrong: #c0392b;
            --border-radius: 12px;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: var(--white);
            padding: 25px 30px;
            text-align: center;
        }

        .app-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .app-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* --- Navigation Tabs --- */
        .nav-tabs {
            display: flex;
            background: #ecf0f1;
            border-bottom: 2px solid #bdc3c7;
        }

        .nav-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-light);
            transition: var(--transition);
            border-bottom: 3px solid transparent;
        }

        .nav-tab:hover {
            background: #e0e6ed;
            color: var(--primary);
        }

        .nav-tab.active {
            background: var(--white);
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        /* --- Content Areas --- */
        .content-area {
            padding: 30px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .content-area.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Study Guide Styles --- */
        .study-search {
            margin-bottom: 20px;
        }

        .study-search input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            transition: var(--transition);
        }

        .study-search input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .module-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .module-btn {
            padding: 8px 16px;
            background: #ecf0f1;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-dark);
            transition: var(--transition);
        }

        .module-btn:hover {
            background: #d5dbdb;
        }

        .module-btn.active {
            background: var(--primary);
            color: var(--white);
        }

        .study-content {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .study-content h3 {
            color: var(--primary);
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 5px;
        }

        .study-content h4 {
            color: var(--text-dark);
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .study-content ul, .study-content ol {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .study-content li {
            margin-bottom: 5px;
        }

        .study-content strong {
            color: var(--primary);
        }

        .highlight-box {
            background: #eaf2f8;
            border-left: 5px solid var(--primary);
            padding: 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
        }

        .highlight-box p {
            margin: 0;
        }

        .code-block {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            overflow-x: auto;
            margin: 10px 0;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .code-block .keyword { color: #e67e22; }
        .code-block .type { color: #3498db; }
        .code-block .string { color: #2ecc71; }
        .code-block .comment { color: #7f8c8d; font-style: italic; }

        .table-container {
            overflow-x: auto;
            margin: 15px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #bdc3c7;
            padding: 10px;
            text-align: left;
        }

        th {
            background: var(--primary);
            color: var(--white);
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        /* --- Quiz Styles --- */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .quiz-progress {
            flex: 1;
            height: 8px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            margin-right: 15px;
        }

        .quiz-progress-bar {
            height: 100%;
            background: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-score {
            font-weight: bold;
            color: var(--primary);
            font-size: 14px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: var(--white);
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-dark);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-light);
            background: #f0f8ff;
            transform: translateX(5px);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #eaf2f8;
        }

        .option-btn.correct {
            background: var(--correct);
            color: white;
            border-color: var(--correct);
        }

        .option-btn.wrong {
            background: var(--wrong);
            color: white;
            border-color: var(--wrong);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .quiz-feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
            font-size: 15px;
        }

        .quiz-feedback.correct-text { color: var(--correct); }
        .quiz-feedback.wrong-text { color: var(--wrong); }

        .quiz-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #d35400;
            transform: translateY(-2px);
        }

        /* --- Results Screen --- */
        .results-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .results-screen h2 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .results-score {
            font-size: 56px;
            font-weight: bold;
            color: var(--secondary);
            margin: 20px 0;
        }

        .results-message {
            font-size: 18px;
            margin-bottom: 30px;
            color: var(--text-light);
        }

        .results-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .app-header h1 { font-size: 20px; }
            .nav-tab { font-size: 14px; padding: 12px; }
            .content-area { padding: 20px; }
            .question-text { font-size: 16px; }
            .option-btn { font-size: 14px; padding: 12px; }
            .results-actions { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1>PF101: Object Oriented Programming</h1>
        <p>Comprehensive Modular Study Guide & Reference Manual</p>
    </div>

    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('guide')">📖 Study Guide</div>
        <div class="nav-tab" onclick="switchTab('quiz')">📝 Take Quiz</div>
    </div>

    <!-- STUDY GUIDE TAB -->
    <div id="guide" class="content-area active">
        <div class="study-search">
            <input type="text" id="searchInput" placeholder="Search the study guide..." onkeyup="searchGuide()">
        </div>
        <div class="module-selector" id="moduleSelector">
            <button class="module-btn active" onclick="filterModule('all', this)">All Modules</button>
            <button class="module-btn" onclick="filterModule('m1', this)">Module 1: Intro to OOP</button>
            <button class="module-btn" onclick="filterModule('m2', this)">Module 2: Planning & Interfaces</button>
            <button class="module-btn" onclick="filterModule('m3', this)">Module 3: Data Handling</button>
            <button class="module-btn" onclick="filterModule('m4', this)">Module 4: Selection & Repetition</button>
            <button class="module-btn" onclick="filterModule('m5', this)">Module 5: Arrays</button>
            <button class="module-btn" onclick="filterModule('m6', this)">Module 6: Controls & Properties</button>
        </div>
        
        <div class="study-content" id="studyContent">
            <!-- Content will be populated by JS -->
        </div>
    </div>

    <!-- QUIZ TAB -->
    <div id="quiz" class="content-area">
        <div id="quizStart">
            <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px;">Ready to test your knowledge?</h2>
            <p style="text-align: center; margin-bottom: 30px;">This quiz covers all 6 modules of the PF101 study guide. Questions and answers are randomized.</p>
            <div style="text-align: center;">
                <button class="btn btn-primary" onclick="startQuiz()">Start Quiz</button>
            </div>
        </div>

        <div id="quizActive" style="display: none;">
            <div class="quiz-header">
                <div class="quiz-progress">
                    <div class="quiz-progress-bar" id="quizProgressBar"></div>
                </div>
                <div class="quiz-score" id="quizScoreDisplay">Score: 0</div>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="quiz-feedback" id="quizFeedback"></div>
            <div class="quiz-actions">
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div id="quizResults" class="results-screen" style="display: none;">
            <h2>Quiz Completed!</h2>
            <div class="results-score" id="finalScore">0 / 0</div>
            <div class="results-message" id="finalMessage"></div>
            <div class="results-actions">
                <button class="btn btn-secondary" onclick="startQuiz()">Play Again</button>
                <button class="btn btn-primary" onclick="switchTab('guide')">Return to Study Guide</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- STUDY GUIDE DATA ---
    const guideData = [
        {
            id: 'm1',
            title: 'Module 1: Introduction to Object-Oriented Programming (Week 2)',
            content: `
                <h3>1.1 Overview of the Object-Oriented Paradigm</h3>
                <ul>
                    <li><strong>Definition:</strong> Object-Oriented Programming (OOP) is a programming paradigm that uses objects and their interactions to design applications and computer programs.</li>
                    <li><strong>Language Support:</strong> C#.NET provides full support for object-oriented programming, including encapsulation, inheritance, and polymorphism.</li>
                    <li><strong>Problem Decomposition:</strong> In OOP, developers break down complex problems into small, manageable parts and solve them individually.</li>
                    <li><strong>Thinking in Objects:</strong> Every variable and function is conceptualized as a property or behavior of an object.</li>
                </ul>
                <div class="highlight-box">
                    <p><strong>Explanation:</strong> Traditional procedural programming focuses on writing functions or procedures that operate sequentially on data. In contrast, OOP models real-world software around entities called objects. An object encapsulates both data (what the object is or has) and actions (what the object can do).</p>
                    <p><strong>Example (The Juice Bottle Analogy):</strong> Imagine you have a bottle of juice:</p>
                    <ul>
                        <li><em>Properties (Attributes):</em> Liquid volume, flavor, color, brand, and temperature.</li>
                        <li><em>Methods/Events (Actions):</em> Opening the cap, pouring the juice, drinking, or checking if the bottle is empty.</li>
                    </ul>
                </div>

                <h3>1.2 The Four Fundamental Principles of OOP</h3>
                <h4>1.2.1 Encapsulation</h4>
                <ul>
                    <li>Binds data and code together into a single unit or object.</li>
                    <li>Treats a group of related properties, methods, and other members as one entity.</li>
                    <li>Hides the internal implementation details of a class from other objects.</li>
                </ul>
                <p><strong>Explanation:</strong> Encapsulation acts as a protective shield. It ensures that the internal representation of an object is hidden from outside interference and misuse. Outside objects interact only through designated interfaces rather than directly tampering with internal state.</p>
                <p><strong>Example (Squid Game Analogy):</strong> The entire "Squid Game" structure functions as a large encapsulation. It combines variables (Frontman, VIP, Host, Players, Money) and functions/methods (Tasks and Games) into one self-contained, governed unit.</p>

                <h4>1.2.2 Inheritance</h4>
                <ul>
                    <li>The ability to create new classes based on an existing class.</li>
                    <li>Allows child (derived) classes to inherit common properties and behaviors from a parent (base) class.</li>
                    <li>Promotes code reusability and eliminates duplication.</li>
                </ul>
                <p><strong>Explanation:</strong> Instead of building every new class from scratch, inheritance lets you define a generalized parent class with shared characteristics. Specialized child classes automatically obtain these traits while adding or customizing their own distinctive attributes.</p>
                <p><strong>Example:</strong> In the Squid Game scenario, all Players inherit identical baseline attributes from the parent class (such as uniform dress code, assigned food, and scheduled tasks). However, individual players (such as Player 001, 067, 456, and 101) extend this base by executing completely different playing strategies.</p>

                <h4>1.2.3 Polymorphism</h4>
                <ul>
                    <li>Means "the ability to exist in many forms."</li>
                    <li>Allows multiple classes to be used interchangeably, even though each class implements the same properties or methods in different ways.</li>
                </ul>
                <p><strong>Explanation:</strong> Polymorphism ensures that the same method name or interface can produce different outcomes depending on which object is invoking it.</p>
                <ul>
                    <li><strong>Narrative Example:</strong> Player 001 (the old man) exists in multiple distinct forms throughout the game: as the Creator, as an active Player, and as the Host.</li>
                    <li><strong>UML Architecture Example:</strong> A base class Person derives into Employee and Customer. Employee is further specialized into Manager, Programmer, and Cleaner. While all three employee classes share the method SaveDetails(), each class executes its own unique implementation.</li>
                </ul>

                <h4>1.2.4 Abstraction</h4>
                <ul>
                    <li>Simplifies complex reality by modeling classes appropriate to the problem.</li>
                    <li>Displays only essential information while concealing the underlying implementation mechanics.</li>
                </ul>
                <p><strong>Explanation:</strong> Abstraction separates what an object does from how it accomplishes it. Users interact with a clean, high-level interface without needing to understand the complicated background machinery.</p>
                <p><strong>Example:</strong> In Squid Game tasks, the players see and interact only with the challenge itself (e.g., carving a honeycomb shape). All the intricate background operations—the armed guards, operational rules, and behind-the-scenes preparation—are entirely hidden from the players' view.</p>

                <h3>1.3 Classes, Objects, and Constructors</h3>
                <ul>
                    <li><strong>Class:</strong> A blueprint or structural description defining the data and methods for a specific type of object.</li>
                    <li><strong>Object:</strong> A usable, concrete instance of a class loaded into memory.</li>
                    <li><strong>Instantiation:</strong> The act of creating an object from a class blueprint using the new keyword.</li>
                    <li><strong>Constructor:</strong> A specialized method inside a class that executes automatically upon object creation to assign starting values.</li>
                </ul>
                <p><strong>Explanation:</strong> A class does not occupy memory for data fields until you instantiate it. The constructor guarantees that new objects begin in a valid, fully initialized state.</p>
                <h4>Code Examples:</h4>
                <div class="code-block">
<span class="comment">// Class Definition with Fields</span>
<span class="keyword">public class</span> <span class="type">Vehicle</span>
{
    <span class="keyword">public string</span> brand;
    <span class="keyword">public string</span> speed;
    <span class="keyword">public string</span> color;
}
                </div>
                <div class="code-block">
<span class="comment">// Class Definition with Constructor</span>
<span class="keyword">public class</span> <span class="type">Vehicle</span>
{
    <span class="keyword">public string</span> Brand;
    <span class="keyword">public string</span> Color;
    <span class="keyword">public int</span> Year;

    <span class="comment">// Constructor assigns initial values upon creation</span>
    <span class="keyword">public</span> Vehicle(<span class="keyword">string</span> brand, <span class="keyword">string</span> color, <span class="keyword">int</span> year)
    {
        Brand = brand;
        Color = color;
        Year = year;
    }
}
                </div>
                <div class="code-block">
<span class="comment">// Instantiating and Using an Object</span>
<span class="keyword">public class</span> <span class="type">Program</span>
{
    <span class="keyword">public static void</span> Main(<span class="keyword">string</span>[] args)
    {
        Vehicle car = <span class="keyword">new</span> Vehicle();
        car.brand = <span class="string">"Toyota"</span>;
        car.speed = <span class="string">"30km/h"</span>;
        car.color = <span class="string">"Blue"</span>;
        Console.WriteLine(<span class="string">"Car brand is: "</span> + car.brand);
        Console.WriteLine(<span class="string">"Car speed is: "</span> + car.speed);
        Console.WriteLine(<span class="string">"Car color is: "</span> + car.color);
        Console.ReadLine();
    }
}
                </div>
            `
        },
        {
            id: 'm2',
            title: 'Module 2: Planning Applications and Designing Interfaces (Week 4)',
            content: `
                <h3>2.1 C#.NET Basic Controls and Their Three Core Elements</h3>
                <ul>
                    <li><strong>Control:</strong> A visual user interface component created on a form using a toolbox.</li>
                    <li><strong>Form as an Object:</strong> In C#, the form itself is an object acting as the primary container for all other controls.</li>
                    <li><strong>Namespace:</strong> Control classes in Windows Forms are defined under System.Windows.Forms.</li>
                    <li><strong>Every control consists of three core elements:</strong>
                        <ol>
                            <li><strong>Properties:</strong> Describe the appearance and behavior of the object.</li>
                            <li><strong>Methods:</strong> Cause an object to perform an action.</li>
                            <li><strong>Events:</strong> Signals raised when an action occurs.</li>
                        </ol>
                    </li>
                </ul>
                <p><strong>Explanation:</strong> Interactive Windows applications rely on event-driven programming. Visual components are configured through properties, manipulated programmatically through methods, and respond to user inputs through events.</p>
                <h4>The Three Elements in Detail:</h4>
                <ol>
                    <li><strong>Properties:</strong> Can be configured at design time using the Properties Window or at runtime using program statements: Object.Property = Value. <br><em>Example: Form1.Text = "Hello"; or changing background color via this.BackColor = Color.LightGray;.</em></li>
                    <li><strong>Methods:</strong> Procedures that belong to a class used to manipulate characteristics or trigger internal logic. You can invoke built-in control methods (e.g., Clear(), Focus()) or add custom methods to your own classes.</li>
                    <li><strong>Events & Event Handlers:</strong> Signals that notify the application that an event occurred (e.g., clicks, keypresses, window loads).
                        <div class="code-block">
<span class="keyword">private void</span> Form1_Load(<span class="keyword">object</span> sender, EventArgs e)
{
    <span class="comment">// Initialization code executed when Form1 loads</span>
}
                        </div>
                    </li>
                </ol>

                <h3>2.2 Common Windows Forms Controls Catalog</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Control Widget</th><th>Description & Purpose</th></tr>
                        </thead>
                        <tbody>
                            <tr><td><strong>Form</strong></td><td>The primary window container for all visual controls.</td></tr>
                            <tr><td><strong>TextBox</strong></td><td>Accepts textual user input.</td></tr>
                            <tr><td><strong>Label</strong></td><td>Displays read-only text that users normally do not edit.</td></tr>
                            <tr><td><strong>Button</strong></td><td>Performs an action or submits a workflow when clicked.</td></tr>
                            <tr><td><strong>ListBox</strong></td><td>Displays a scrollable list of selectable items.</td></tr>
                            <tr><td><strong>ComboBox</strong></td><td>Provides a compact drop-down selection list.</td></tr>
                            <tr><td><strong>RadioButton</strong></td><td>Allows the user to select exactly one option from a mutually exclusive group.</td></tr>
                            <tr><td><strong>CheckBox</strong></td><td>Allows independent yes/no or multiple non-exclusive selections.</td></tr>
                            <tr><td><strong>PictureBox</strong></td><td>Displays image graphics on the form.</td></tr>
                            <tr><td><strong>ProgressBar</strong></td><td>Visually indicates the progress of a running task.</td></tr>
                            <tr><td><strong>ScrollBar</strong></td><td>Implements vertical or horizontal scrolling capability.</td></tr>
                            <tr><td><strong>DateTimePicker</strong></td><td>Allows users to select and format date and time entries.</td></tr>
                        </tbody>
                    </table>
                </div>

                <h3>2.3 Essential Form Properties Reference</h3>
                <ul>
                    <li><strong>Name:</strong> Identifies the form or control programmatically in code.</li>
                    <li><strong>Text:</strong> Defines the caption text displayed in the title bar or on the control.</li>
                    <li><strong>AcceptButton / CancelButton:</strong> Designates which button clicks automatically on ENTER or ESC.</li>
                    <li><strong>BackColor / ForeColor:</strong> Configures the background and text colors.</li>
                    <li><strong>ClientSize / Size / Width / Height:</strong> Controls dimensions in pixels.</li>
                    <li><strong>ControlBox, MaximizeBox, MinimizeBox:</strong> Toggles standard window caption buttons.</li>
                    <li><strong>Font:</strong> Configures text family, size, and styling attributes.</li>
                    <li><strong>FormBorderStyle:</strong> Determines the border appearance and window resizing capabilities.</li>
                    <li><strong>StartPosition:</strong> Sets where the form opens on screen (e.g., CenterScreen).</li>
                    <li><strong>WindowState:</strong> Controls whether the form is Normal, Minimized, or Maximized.</li>
                    <li><strong>Visible / Enabled:</strong> Toggles whether controls can be seen or interacted with.</li>
                    <li><strong>Opacity:</strong> Controls transparency level of the form.</li>
                    <li><strong>TopMost:</strong> Forces the window to stay on top of other running windows.</li>
                </ul>

                <h3>2.4 Tab Order, Anchoring, and Docking</h3>
                <ul>

                    <li><strong>ListView (→ Student Records Table):</strong> Displays enrolled student records across structured columns.</li>
                </ul>
            `
        }
    ];

    // --- QUIZ DATA ---
    const quizQuestions = [
        // Module 1
        { q: "What is the primary definition of Object-Oriented Programming (OOP)?", a: ["A paradigm that uses objects and their interactions to design applications", "A paradigm that focuses on writing sequential functions", "A language only used for web development", "A hardware description language"], correct: "A paradigm that uses objects and their interactions to design applications", module: "m1" },
        { q: "Which of the following is NOT one of the four fundamental principles of OOP?", a: ["Encapsulation", "Inheritance", "Polymorphism", "Sequential Execution"], correct: "Sequential Execution", module: "m1" },
        { q: "Which principle binds data and code together and hides internal implementation details?", a: ["Inheritance", "Polymorphism", "Encapsulation", "Abstraction"], correct: "Encapsulation", module: "m1" },
        { q: "Which principle allows child classes to inherit common properties from a parent class?", a: ["Encapsulation", "Inheritance", "Polymorphism", "Abstraction"], correct: "Inheritance", module: "m1" },
        { q: "Which principle means 'the ability to exist in many forms'?", a: ["Encapsulation", "Inheritance", "Polymorphism", "Abstraction"], correct: "Polymorphism", module: "m1" },
        { q: "Which principle displays only essential information while concealing underlying mechanics?", a: ["Encapsulation", "Inheritance", "Polymorphism", "Abstraction"], correct: "Abstraction", module: "m1" },
        { q: "In OOP, what is a blueprint or structural description defining data and methods called?", a: ["Object", "Class", "Constructor", "Instance"], correct: "Class", module: "m1" },
        { q: "What is the act of creating an object from a class blueprint called?", a: ["Abstraction", "Instantiation", "Encapsulation", "Inheritance"], correct: "Instantiation", module: "m1" },

        // Module 2
        { q: "In C#.NET, every control consists of three core elements. Which are they?", a: ["Properties, Methods, Events", "Variables, Functions, Loops", "Classes, Objects, Arrays", "Input, Process, Output"], correct: "Properties, Methods, Events", module: "m2" },
        { q: "Which control is the primary window container for all visual controls?", a: ["TextBox", "Label", "Form", "Button"], correct: "Form", module: "m2" },
        { q: "Which control allows the user to select exactly one option from a mutually exclusive group?", a: ["CheckBox", "RadioButton", "ComboBox", "ListBox"], correct: "RadioButton", module: "m2" },
        { q: "Which property defines the caption text displayed in the title bar or on the control?", a: ["Name", "Text", "Caption", "Label"], correct: "Text", module: "m2" },
        { q: "What does the TabIndex property specify?", a: ["The size of the control", "The focus navigation order when pressing TAB", "The color of the tab", "The database connection"], correct: "The focus navigation order when pressing TAB", module: "m2" },
        { q: "Which property causes a control to fill a specific boundary or the entire client area of its container?", a: ["Anchor", "Dock", "TabStop", "Opacity"], correct: "Dock", module: "m2" },

        // Module 3
        { q: "What is the core data flow pipeline in data handling?", a: ["Input → Store → Process → Output", "Read → Write → Delete → Update", "Start → Stop → Pause → Resume", "Create → Destroy → Modify → Save"], correct: "Input → Store → Process → Output", module: "m3" },
        { q: "Which type of variable is declared inside a method and is only accessible within that block?", a: ["Instance Variable", "Static Variable", "Local Variable", "Parameter"], correct: "Local Variable", module: "m3" },
        { q: "Which type of variable belongs to the class itself and is shared universally across all objects?", a: ["Instance Variable", "Static Variable", "Local Variable", "Parameter"], correct: "Static Variable", module: "m3" },
        { q: "Which keyword defines a fixed value that cannot be modified after declaration?", a: ["static", "readonly", "const", "fixed"], correct: "const", module: "m3" },
        { q: "Which modifier makes a member accessible only within the containing class?", a: ["public", "private", "protected", "internal"], correct: "private", module: "m3" },
        { q: "Which C# data type is used for ultra-precise financial calculations?", a: ["float", "double", "decimal", "int"], correct: "decimal", module: "m3" },
        { q: "What is the result of the integer division 10 / 3 in C#?", a: ["3.33", "3", "4", "0"], correct: "3", module: "m3" },

        // Module 4
        { q: "Which operator is used for equality comparison in C#?", a: ["=", "==", "!=", "==="], correct: "==", module: "m4" },
        { q: "Which loop is guaranteed to execute at least once?", a: ["for", "while", "do-while", "foreach"], correct: "do-while", module: "m4" },
        { q: "Which loop is a pre-test loop that checks the condition first?", a: ["for", "while", "do-while", "foreach"], correct: "while", module: "m4" },
        { q: "Which statement immediately terminates and breaks out of an entire loop structure?", a: ["continue", "break", "return", "exit"], correct: "break", module: "m4" },
        { q: "Which statement skips only the current iteration and jumps to the next evaluation cycle?", a: ["continue", "break", "return", "exit"], correct: "continue", module: "m4" },
        { q: "What does DateTime.Now retrieve?", a: ["The current system timestamp", "The current user's name", "The current file size", "The current database connection"], correct: "The current system timestamp", module: "m4" },

        // Module 5
        { q: "What is the index of the first element in a C# array?", a: ["1", "0", "-1", "10"], correct: "0", module: "m5" },
        { q: "What happens if you try to access an array index outside its valid range?", a: ["It returns null", "It returns 0", "It triggers an IndexOutOfRangeException", "It automatically resizes the array"], correct: "It triggers an IndexOutOfRangeException", module: "m5" },
        { q: "What does the .Length property of an array return?", a: ["The last index", "The total number of elements", "The memory size in bytes", "The data type"], correct: "The total number of elements", module: "m5" },
        { q: "How do you declare a two-dimensional array in C#?", a: ["dataType[] arrayName", "dataType[,] arrayName", "dataType[][] arrayName", "dataType(,) arrayName"], correct: "dataType[,] arrayName", module: "m5" },
        { q: "In the array int[] num = {1, 2, 3};, what does num[1] return?", a: ["1", "2", "3", "0"], correct: "2", module: "m5" },

        // Module 6
        { q: "Which method is used to set input focus to a control?", a: ["Clear()", "Focus()", "Close()", "Add()"], correct: "Focus()", module: "m6" },
        { q: "Which dialog control displays alerts, warnings, and confirmations?", a: ["OpenFileDialog", "SaveFileDialog", "MessageBox", "ColorDialog"], correct: "MessageBox", module: "m6" },
        { q: "Which control displays a hierarchical tree with expandable nodes?", a: ["ListView", "TreeView", "ComboBox", "ListBox"], correct: "TreeView", module: "m6" },
        { q: "Which control displays tabular lists and item collections with column fields?", a: ["TreeView", "ListView", "ComboBox", "ListBox"], correct: "ListView", module: "m6" },
        { q: "Which RichTextBox feature allows advanced document editing?", a: ["Bold, Italics, Underline, and text coloring", "Database connectivity", "Network communication", "Hardware acceleration"], correct: "Bold, Italics, Underline, and text coloring", module: "m6" }
    ];

    // --- GLOBAL STATE ---
    let quizQuestionsShuffled = [];
    let currentQuizIndex = 0;
    let quizScore = 0;
    let isAnswered = false;

    // --- TAB SWITCHING ---
    function switchTab(tabId) {
        document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.content-area').forEach(area => area.classList.remove('active'));
        
        document.querySelector(`.nav-tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    // --- STUDY GUIDE LOGIC ---
    function renderGuide(filter = 'all', searchTerm = '') {
        const container = document.getElementById('studyContent');
        let html = '';

        guideData.forEach(module => {
            if (filter !== 'all' && module.id !== filter) return;

            if (searchTerm && !module.content.toLowerCase().includes(searchTerm.toLowerCase()) && !module.title.toLowerCase().includes(searchTerm.toLowerCase())) {
                return;
            }

            html += `<div class="guide-module" id="${module.id}">
                        <h2 style="color: var(--primary); margin-top: 20px;">${module.title}</h2>
                        ${module.content}
                    </div>`;
        });

        if (html === '') {
            html = '<p style="text-align: center; color: var(--text-light);">No results found.</p>';
        }

        container.innerHTML = html;
    }

    function filterModule(moduleId, btn) {
        document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('searchInput').value = '';
        renderGuide(moduleId);
    }

    function searchGuide() {
        const term = document.getElementById('searchInput').value;
        document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.module-btn[onclick="filterModule(\'all\', this)"]').classList.add('active');
        renderGuide('all', term);
    }

    // --- QUIZ LOGIC ---
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz() {
        quizQuestionsShuffled = shuffleArray([...quizQuestions]).slice(0, 30); // Limit to 30 random questions
        currentQuizIndex = 0;
        quizScore = 0;
        isAnswered = false;

        document.getElementById('quizStart').style.display = 'none';
        document.getElementById('quizResults').style.display = 'none';
        document.getElementById('quizActive').style.display = 'block';

        loadQuizQuestion();
    }

    function loadQuizQuestion() {
        if (currentQuizIndex >= quizQuestionsShuffled.length) {
            showQuizResults();
            return;
        }

        const q = quizQuestionsShuffled[currentQuizIndex];
        const progress = (currentQuizIndex / quizQuestionsShuffled.length) * 100;
        
        document.getElementById('quizProgressBar').style.width = `${progress}%`;
        document.getElementById('quizScoreDisplay').textContent = `Score: ${quizScore}`;
        document.getElementById('questionText').textContent = `Q${currentQuizIndex + 1}: ${q.q}`;
        
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        
        const shuffledAnswers = shuffleArray([...q.a]);
        
        shuffledAnswers.forEach(answer => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            btn.textContent = answer;
            btn.onclick = () => selectQuizAnswer(btn, answer, q.correct);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('quizFeedback').textContent = '';
        document.getElementById('quizFeedback').className = 'quiz-feedback';
        document.getElementById('nextBtn').disabled = true;
        document.getElementById('nextBtn').textContent = (currentQuizIndex === quizQuestionsShuffled.length - 1) ? "See Results" : "Next Question";
        isAnswered = false;
    }

    function selectQuizAnswer(selectedBtn, selectedAnswer, correctAnswer) {
        if (isAnswered) return;
        isAnswered = true;

        const allBtns = document.querySelectorAll('#optionsContainer .option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        const feedbackEl = document.getElementById('quizFeedback');

        if (selectedAnswer === correctAnswer) {
            selectedBtn.classList.add('correct');
            feedbackEl.textContent = "Correct!";
            feedbackEl.classList.add('correct-text');
            quizScore++;
        } else {
            selectedBtn.classList.add('wrong');
            feedbackEl.textContent = `Incorrect. The correct answer is: ${correctAnswer}`;
            feedbackEl.classList.add('wrong-text');
            
            allBtns.forEach(btn => {
                if (btn.textContent === correctAnswer) {
                    btn.classList.add('correct');
                }
            });
        }

        document.getElementById('quizScoreDisplay').textContent = `Score: ${quizScore}`;
        document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
        currentQuizIndex++;
        loadQuizQuestion();
    }

    function showQuizResults() {
        document.getElementById('quizActive').style.display = 'none';
        document.getElementById('quizResults').style.display = 'block';
        
        const total = quizQuestionsShuffled.length;
        document.getElementById('finalScore').textContent = `${quizScore} / ${total}`;
        
        const percentage = (quizScore / total) * 100;
        let message = "";
        if (percentage === 100) message = "Perfect score! You are an OOP master! 🏆";
        else if (percentage >= 80) message = "Excellent work! You have a strong grasp of the concepts. 🌟";
        else if (percentage >= 60) message = "Good job! A little more review and you'll ace it. 📚";
        else message = "Keep studying! Review the guide and try again. 💪";
        
        document.getElementById('finalMessage').textContent = message;
    }

    // --- INITIALIZATION ---
    renderGuide();
</script>
