<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Badminton Ultimate Quiz</title>
    <style>
        /* --- CSS Reset & Variables --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --court-green: #2e7d32;
            --court-green-dark: #1b5e20;
            --line-white: #ffffff;
            --net-color: #4e342e;
            --net-shadow: rgba(0, 0, 0, 0.5);
            --text-dark: #1a1a1a;
            --white: #ffffff;
            --correct-green: #43a047;
            --wrong-red: #e53935;
            --accent-yellow: #fdd835;
            --blue-accent: #1565c0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevent scrolling */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1b2a; /* Dark background outside the court */
        }

        /* --- Court Container --- */
        .court-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: var(--court-green);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Court Lines (Visual Only) --- */
        .court-line {
            position: absolute;
            background-color: var(--line-white);
            z-index: 1;
            pointer-events: none;
        }

        /* Outer Boundary */
        .line-outer-top { top: 5%; left: 5%; width: 90%; height: 2px; }
        .line-outer-bottom { bottom: 5%; left: 5%; width: 90%; height: 2px; }
        .line-outer-left { top: 5%; left: 5%; width: 2px; height: 90%; }
        .line-outer-right { top: 5%; right: 5%; width: 2px; height: 90%; }

        /* Inner Lines (Doubles Long Service Line) */
        .line-inner-top { top: 15%; left: 5%; width: 90%; height: 2px; }
        .line-inner-bottom { bottom: 15%; left: 5%; width: 90%; height: 2px; }

        /* Center Line */
        .line-center { top: 15%; left: 50%; width: 2px; height: 70%; transform: translateX(-50%); }

        /* Short Service Lines */
        .line-short-service-top { top: 30%; left: 5%; width: 90%; height: 2px; }
        .line-short-service-bottom { bottom: 30%; left: 5%; width: 90%; height: 2px; }

        /* --- The Net --- */
        .net {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 16px;
            transform: translateY(-50%);
            background: repeating-linear-gradient(
                90deg,
                var(--net-color) 0px,
                var(--net-color) 4px,
                transparent 4px,
                transparent 8px
            );
            border-top: 3px solid var(--white);
            border-bottom: 3px solid var(--white);
            z-index: 10;
            box-shadow: 0 4px 10px var(--net-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .net::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(78, 52, 46, 0.4) 0px,
                rgba(78, 52, 46, 0.4) 4px,
                transparent 4px,
                transparent 8px
            );
        }

        /* --- UI Overlay Container --- */
        .ui-container {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            justify-content: center;
            align-items: center;
        }

        /* --- Top Section (Category Selection) --- */
        .top-section, .bottom-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 10px;
        }

        /* Category Buttons */
        .category-selection {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .category-btn {
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--white);
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .category-btn:hover {
            background-color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            border-color: var(--accent-yellow);
        }

        .category-btn small {
            display: block;
            font-size: 11px;
            font-weight: normal;
            color: #555;
            margin-top: 4px;
        }

        /* --- Quiz Content --- */
        .quiz-content {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: space-between;
        }

        .quiz-content.active {
            display: flex;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-yellow);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Question Area */
        .question-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
        }

        .question-text {
            font-size: clamp(15px, 2.2vh, 20px);
            font-weight: 700;
            color: var(--white);
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 700px;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 700px;
        }

        .option-btn {
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--white);
            border-radius: 8px;
            padding: 10px;
            font-size: clamp(12px, 1.6vh, 15px);
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 45px;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--white);
            border-color: var(--accent-yellow);
            transform: scale(1.02);
        }

        .option-btn.selected {
            border-color: var(--blue-accent);
            background-color: #e3f2fd;
        }

        .option-btn.correct {
            background-color: var(--correct-green);
            color: var(--white);
            border-color: var(--correct-green);
        }

        .option-btn.wrong {
            background-color: var(--wrong-red);
            color: var(--white);
            border-color: var(--wrong-red);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Feedback Area */
        .feedback-area {
            height: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 8px;
        }

        .feedback {
            font-size: 13px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .feedback.correct-text { color: var(--accent-yellow); }
        .feedback.wrong-text { color: #ffcdd2; }

        /* Next Button */
        .next-btn {
            background-color: var(--accent-yellow);
            color: var(--text-dark);
            border: none;
            border-radius: 8px;
            padding: 10px 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 300px;
            margin-top: 5px;
        }

        .next-btn:hover:not(:disabled) {
            background-color: #fbc02d;
            transform: translateY(-2px);
        }

        .next-btn:disabled {
            background-color: #9e9e9e;
            color: #616161;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Results Screen */
        .results-container {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
            width: 100%;
        }

        .results-container.active {
            display: flex;
        }

        .results-container h2 {
            color: var(--white);
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .score-display {
            font-size: 56px;
            font-weight: bold;
            color: var(--accent-yellow);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 15px 0;
        }

        .result-actions {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
            justify-content: center;
        }

        .action-btn {
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            min-width: 140px;
        }

        .play-again-btn {
            background-color: var(--accent-yellow);
            color: var(--text-dark);
        }

        .play-again-btn:hover {
            background-color: #fbc02d;
            transform: translateY(-2px);
        }

        .home-btn {
            background-color: var(--white);
            color: var(--text-dark);
            border: 2px solid var(--text-dark);
        }

        .home-btn:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }

        /* Responsive Adjustments for smaller screens */
        @media (max-width: 600px) {
            .options-container {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .option-btn {
                min-height: 40px;
                padding: 8px;
            }
            .question-text {
                font-size: 14px;
                padding: 8px;
            }
            .net {
                height: 12px;
            }
            .category-btn {
                padding: 10px;
                font-size: 14px;
            }
            .result-actions {
                flex-direction: column;
                align-items: center;
            }
            .action-btn {
                width: 80%;
            }
        }
        
        /* Ensure the UI doesn't overflow on very short screens */
        @media (max-height: 650px) {
            .question-text { font-size: 13px; padding: 6px; }
            .option-btn { font-size: 11px; padding: 6px; min-height: 35px; }
            .next-btn { padding: 6px 15px; font-size: 13px; }
            .category-btn { padding: 8px; font-size: 13px; }
            .category-btn small { font-size: 10px; }
            .score-display { font-size: 40px; margin: 5px 0; }
            .results-container h2 { font-size: 22px; }
            .action-btn { padding: 8px 15px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="court-container">
    <!-- Court Lines -->
    <div class="court-line line-outer-top"></div>
    <div class="court-line line-outer-bottom"></div>
    <div class="court-line line-outer-left"></div>
    <div class="court-line line-outer-right"></div>
    <div class="court-line line-inner-top"></div>
    <div class="court-line line-inner-bottom"></div>
    <div class="court-line line-center"></div>
    <div class="court-line line-short-service-top"></div>
    <div class="court-line line-short-service-bottom"></div>

    <!-- The Net -->
    <div class="net"></div>

    <!-- UI Overlay -->
    <div class="ui-container">
        
        <!-- Category Selection Screen -->
        <div id="category-selection" class="category-selection top-section">
            <button class="category-btn" onclick="startQuiz('dates')">
                📅 Dates & History
                <small>Years, people, and evolution.</small>
            </button>
            <button class="category-btn" onclick="startQuiz('orgs')">
                🏢 Organizations & Governing Bodies
                <small>BWF, continental bodies, and competitions.</small>
            </button>
            <button class="category-btn" onclick="startQuiz('terms')">
                📖 Terminologies
                <small>Rally, Alley, Drop, Smash, Let, Fault, BO, etc.</small>
            </button>
            <button class="category-btn" onclick="startQuiz('dimensions')">
                📏 Court & Net Dimensions
                <small>Width, length, service court, and net height.</small>
            </button>
            <button class="category-btn" onclick="startQuiz('full')">
                🌟 Full Comprehensive Review
                <small>A mix of everything: History, Organizations, Equipment, Rules, and Dimensions.</small>
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-content" class="quiz-content">
            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>
            
            <div class="question-area">
                <div class="question-text" id="question">Loading question...</div>
                <div class="options-container" id="options"></div>
                <div class="feedback-area">
                    <div class="feedback" id="feedback"></div>
                </div>
            </div>
            
            <div class="bottom-section" style="flex: 0;">
                <button class="next-btn" id="next-btn" disabled>Next Question</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div class="results-container" id="results">
            <h2>Quiz Completed!</h2>
            <p style="color: white; font-size: 16px; margin-bottom: 5px;">Your final score is:</p>
            <div class="score-display" id="score">0 / 0</div>
            <div class="result-actions">
                <button class="action-btn play-again-btn" id="play-again-btn">Play Again</button>
                <button class="action-btn home-btn" onclick="goHome()">Return Home</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Comprehensive Question Pool with Tags ---
    const questionPool = [

        { q: "How high is the badminton net at the edges?", a: ["1.55 meters", "1.52 meters", "1.60 meters", "1.45 meters"], correct: "1.55 meters", tag: "dimensions" },
        { q: "How high is the badminton net in the center?", a: ["1.52 meters", "1.55 meters", "1.60 meters", "1.45 meters"], correct: "1.52 meters", tag: "dimensions" },

        // --- Full Review (Everything Else - Equipment, Fitness, Rules) ---
        { q: "What is the most common form of badminton played with 2 players on each team?", a: ["Singles", "Doubles", "Mixed Doubles", "Triples"], correct: "Doubles", tag: "full" },
        { q: "How many players are on the court in a 'Mixed Doubles' match?", a: ["2 players (1 male, 1 female)", "4 players (2 males, 2 females)", "1 player vs 1 player", "4 players (all male)"], correct: "4 players (2 males, 2 females)", tag: "full" },
        { q: "Which of the following is NOT a required fitness component for high-level badminton?", a: ["Aerobic Stamina", "Agility", "Flexibility", "Speed"], correct: "Flexibility", tag: "full" },
        { q: "Which fitness component is described as 'the ability to change direction quickly'?", a: ["Agility", "Speed", "Strength", "Precision"], correct: "Agility", tag: "full" },
        { q: "What does the memory aid 'S-A-S-S-P' stand for in badminton fitness?", a: ["Stamina, Agility, Strength, Speed, Precision", "Speed, Agility, Stamina, Strength, Power", "Strength, Agility, Speed, Stamina, Precision", "Stamina, Agility, Speed, Strength, Power"], correct: "Stamina, Agility, Strength, Speed, Precision", tag: "full" },
        { q: "In serving, what does the memory aid 'Even = Right' refer to?", a: ["The score determines which side to serve from", "The number of players on the court", "The side the receiver stands on", "The type of grip used"], correct: "The score determines which side to serve from", tag: "full" },
        { q: "Which side should you serve from if the score is an odd number?", a: ["Right side", "Left side", "Center", "Either side"], correct: "Left side", tag: "full" },

        { q: "What is the weight range of a standard badminton racket?", a: ["50 and 70 grams", "80 and 100 grams", "110 and 130 grams", "60 and 80 grams"], correct: "80 and 100 grams", tag: "full" },

        { q: "What is the maximum width allowed for a racket's stringed area?", a: ["200 mm", "220 mm", "250 mm", "280 mm"], correct: "220 mm", tag: "full" },

        { q: "How many overlapping feathers does a standard feather shuttlecock have?", a: ["10", "14", "16", "20"], correct: "16", tag: "full" },
        { q: "What is the base of the shuttlecock called?", a: ["Cork", "Head", "Throat", "Handle"], correct: "Cork", tag: "full" },
        { q: "Which of the following is NOT a material used to make racket strings?", a: ["Nylon", "Carbon fiber", "Plastic", "Cotton"], correct: "Cotton", tag: "full" }
    ];

    // --- Quiz Configuration ---
    let TOTAL_QUESTIONS = 0;
    let currentQuestionIndex = 0;
    let score = 0;
    let selectedQuestions = [];
    let currentCategory = '';

    // --- DOM Elements ---
    const categorySelection = document.getElementById('category-selection');
    const quizContent = document.getElementById('quiz-content');
    const resultsContainer = document.getElementById('results');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const progressEl = document.getElementById('progress');
    const scoreEl = document.getElementById('score');
    const playAgainBtn = document.getElementById('play-again-btn');

    // --- Utility Functions ---
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz(mode) {
        currentCategory = mode;
        let filteredPool = [];
        
        if (mode === 'dates') {
            filteredPool = questionPool.filter(q => q.tag === 'dates');
            TOTAL_QUESTIONS = filteredPool.length; 
        } else if (mode === 'orgs') {
            filteredPool = questionPool.filter(q => q.tag === 'orgs');
            TOTAL_QUESTIONS = filteredPool.length; 
        } else if (mode === 'terms') {
            filteredPool = questionPool.filter(q => q.tag === 'terms');
            TOTAL_QUESTIONS = filteredPool.length;
        } else if (mode === 'dimensions') {
            filteredPool = questionPool.filter(q => q.tag === 'dimensions');
            TOTAL_QUESTIONS = filteredPool.length;
        } else {
            filteredPool = questionPool;
            TOTAL_QUESTIONS = 30; 
        }

        selectedQuestions = shuffleArray([...filteredPool]).slice(0, TOTAL_QUESTIONS);
        
        currentQuestionIndex = 0;
        score = 0;
        
        categorySelection.style.display = 'none';
        quizContent.classList.add('active');
        resultsContainer.classList.remove('active');
        
        loadQuestion();
    }

    function loadQuestion() {
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        nextBtn.disabled = true;
        optionsEl.innerHTML = '';

        const progressPercent = ((currentQuestionIndex) / TOTAL_QUESTIONS) * 100;
        progressEl.style.width = `${progressPercent}%`;

        const currentQ = selectedQuestions[currentQuestionIndex];
        questionEl.textContent = `Q${currentQuestionIndex + 1}: ${currentQ.q}`;

        const shuffledAnswers = shuffleArray([...currentQ.a]);

        shuffledAnswers.forEach(answer => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            btn.textContent = answer;
            btn.onclick = () => selectAnswer(btn, answer, currentQ.correct);
            optionsEl.appendChild(btn);
        });
    }

    function selectAnswer(selectedBtn, selectedAnswer, correctAnswer) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        if (selectedAnswer === correctAnswer) {
            selectedBtn.classList.add('correct');
            feedbackEl.textContent = "Correct!";
            feedbackEl.classList.add('correct-text');
            score++;
        } else {
            selectedBtn.classList.add('wrong');
            feedbackEl.textContent = `Incorrect. The correct answer is: ${correctAnswer}`;
            feedbackEl.classList.add('wrong-text');
            
            allBtns.forEach(btn => {
                if (btn.textContent === correctAnswer) {
                    btn.classList.add('correct');
                }
            });
        }

        nextBtn.disabled = false;
        nextBtn.textContent = (currentQuestionIndex === TOTAL_QUESTIONS - 1) ? "See Results" : "Next Question";
    }

    nextBtn.addEventListener('click', () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_QUESTIONS) {
            loadQuestion();
        } else {
            showResults();
        }
    });

    function showResults() {
        quizContent.classList.remove('active');
        resultsContainer.classList.add('active');
        scoreEl.textContent = `${score} / ${TOTAL_QUESTIONS}`;
        progressEl.style.width = '100%';
    }

    // --- Play Again & Return Home Logic ---
    playAgainBtn.addEventListener('click', () => {
        startQuiz(currentCategory);
    });

    function goHome() {
        categorySelection.style.display = 'block';
        quizContent.classList.remove('active');
        resultsContainer.classList.remove('active');
        currentQuestionIndex = 0;
        score = 0;
        progressEl.style.width = '0%';
    }
</script>
