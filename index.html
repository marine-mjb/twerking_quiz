<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCU IT Study Hub: CC105 & PF101</title>
    <style>
        /* --- CSS Variables & Reset --- */
        :root {
            --primary: #1a5276;
            --primary-light: #2980b9;
            --secondary: #e67e22;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --correct: #27ae60;
            --wrong: #c0392b;
            --border-radius: 12px;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: var(--white);
            padding: 25px 30px;
            text-align: center;
            position: relative;
        }

        .app-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .app-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition);
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.4);
        }

        /* --- Navigation Tabs --- */
        .nav-tabs {
            display: flex;
            background: #ecf0f1;
            border-bottom: 2px solid #bdc3c7;
        }

        .nav-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-light);
            transition: var(--transition);
            border-bottom: 3px solid transparent;
        }

        .nav-tab:hover {
            background: #e0e6ed;
            color: var(--primary);
        }

        .nav-tab.active {
            background: var(--white);
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        /* --- Content Areas --- */
        .content-area {
            padding: 30px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .content-area.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Home Screen (Course Selection) --- */
        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .course-card {
            background: var(--white);
            border: 2px solid #bdc3c7;
            border-radius: var(--border-radius);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .course-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .course-card .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .course-card h2 {
            font-size: 20px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .course-card p {
            font-size: 14px;
            color: var(--text-light);
        }

        /* --- Study Guide Styles --- */
        .study-search {
            margin-bottom: 20px;
        }

        .study-search input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            transition: var(--transition);
        }

        .study-search input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .module-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .module-btn {
            padding: 8px 16px;
            background: #ecf0f1;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-dark);
            transition: var(--transition);
        }

        .module-btn:hover {
            background: #d5dbdb;
        }

        .module-btn.active {
            background: var(--primary);
            color: var(--white);
        }

        .study-content {
            max-height: 550px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .study-content h3 {
            color: var(--primary);
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 5px;
        }

        .study-content h4 {
            color: var(--text-dark);
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .study-content ul, .study-content ol {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .study-content li {
            margin-bottom: 5px;
        }

        .study-content strong {
            color: var(--primary);
        }

        .highlight-box {
            background: #eaf2f8;
            border-left: 5px solid var(--primary);
            padding: 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
        }

        .highlight-box p {
            margin: 0;
        }

        .code-block {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            overflow-x: auto;
            margin: 10px 0;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .code-block .keyword { color: #e67e22; }
        .code-block .type { color: #3498db; }
        .code-block .string { color: #2ecc71; }
        .code-block .comment { color: #7f8c8d; font-style: italic; }

        .table-container {
            overflow-x: auto;
            margin: 15px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #bdc3c7;
            padding: 10px;
            text-align: left;
        }

        th {
            background: var(--primary);
            color: var(--white);
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        /* --- Quiz Styles --- */
        .quiz-setup {
            text-align: center;
            padding: 20px 0;
        }

        .quiz-setup h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .quiz-setup p {
            margin-bottom: 25px;
            color: var(--text-light);
        }

        .item-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .item-btn {
            padding: 15px 25px;
            background: var(--white);
            border: 2px solid var(--primary-light);
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            cursor: pointer;
            transition: var(--transition);
            min-width: 80px;
        }

        .item-btn:hover {
            background: #eaf2f8;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .quiz-progress {
            flex: 1;
            height: 8px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            margin-right: 15px;
        }

        .quiz-progress-bar {
            height: 100%;
            background: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-score {
            font-weight: bold;
            color: var(--primary);
            font-size: 14px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: var(--white);
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-dark);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-light);
            background: #f0f8ff;
            transform: translateX(5px);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #eaf2f8;
        }

        .option-btn.correct {
            background: var(--correct);
            color: white;
            border-color: var(--correct);
        }

        .option-btn.wrong {
            background: var(--wrong);
            color: white;
            border-color: var(--wrong);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .quiz-feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
            font-size: 15px;
        }

        .quiz-feedback.correct-text { color: var(--correct); }
        .quiz-feedback.wrong-text { color: var(--wrong); }

        .quiz-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #d35400;
            transform: translateY(-2px);
        }

        /* --- Results Screen --- */
        .results-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .results-screen h2 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .results-score {
            font-size: 56px;
            font-weight: bold;
            color: var(--secondary);
            margin: 20px 0;
        }

        .results-message {
            font-size: 18px;
            margin-bottom: 30px;
            color: var(--text-light);
        }

        .results-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .app-header h1 { font-size: 20px; }
            .nav-tab { font-size: 14px; padding: 12px; }
            .content-area { padding: 20px; }
            .question-text { font-size: 16px; }
            .option-btn { font-size: 14px; padding: 12px; }
            .results-actions { flex-direction: column; }
            .btn { width: 100%; }
            .home-grid { grid-template-columns: 1fr; }
            .item-selector { flex-direction: column; align-items: center; }
            .item-btn { width: 80%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header" id="appHeader">
        <button class="back-btn" id="backBtn" style="display: none;" onclick="goHome()">← Home</button>
        <h1 id="headerTitle">QCU IT Study Hub</h1>
        <p id="headerSubtitle">Choose a course to begin</p>
    </div>

    <!-- MAIN MENU (Course Selection) -->
    <div id="home" class="content-area active">
        <div class="home-grid">
            <div class="course-card" onclick="selectCourse('cc105')">
                <div class="icon">🗄️</div>
                <h2>CC105: Information Management</h2>
                <p>Database Systems & Normalization</p>
            </div>
            <div class="course-card" onclick="selectCourse('pf101')">
                <div class="icon">💻</div>
                <h2>PF101: Object Oriented Programming</h2>
                <p>C#.NET & OOP Concepts</p>
            </div>
        </div>
    </div>

    <!-- COURSE CONTENT AREA -->
    <div id="courseContent" style="display: none;">
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('guide')">📖 Study Guide</div>
            <div class="nav-tab" onclick="switchTab('quiz')">📝 Take Quiz</div>
        </div>

        <!-- STUDY GUIDE TAB -->
        <div id="guide" class="content-area active">
            <div class="study-search">
                <input type="text" id="searchInput" placeholder="Search the study guide..." onkeyup="searchGuide()">
            </div>
            <div class="module-selector" id="moduleSelector">
                <!-- Populated by JS -->
            </div>
            <div class="study-content" id="studyContent">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- QUIZ TAB -->
        <div id="quiz" class="content-area">
            <div id="quizSetup" class="quiz-setup">
                <h2>Quiz Setup</h2>
                <p>Select how many items you want to answer.</p>
                <div class="item-selector" id="itemSelector">
                    <!-- Populated by JS -->
                </div>
            </div>

            <div id="quizActive" style="display: none;">
                <div class="quiz-header">
                    <div class="quiz-progress">
                        <div class="quiz-progress-bar" id="quizProgressBar"></div>
                    </div>
                    <div class="quiz-score" id="quizScoreDisplay">Score: 0</div>
                </div>
                <div class="question-text" id="questionText"></div>
                <div class="options-container" id="optionsContainer"></div>
                <div class="quiz-feedback" id="quizFeedback"></div>
                <div class="quiz-actions">
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
                </div>
            </div>

            <div id="quizResults" class="results-screen" style="display: none;">
                <h2>Quiz Completed!</h2>
                <div class="results-score" id="finalScore">0 / 0</div>
                <div class="results-message" id="finalMessage"></div>
                <div class="results-actions">
                    <button class="btn btn-secondary" onclick="restartQuiz()">Play Again</button>
                    <button class="btn btn-primary" onclick="switchTab('guide')">Return to Study Guide</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // =================================================================
    // DATA STORAGE
    // =================================================================

    const courseData = {
        cc105: {
            title: "CC105: Information Management",
            subtitle: "Comprehensive Database Systems & Normalization Study Guide",
            modules: [
                {
                    id: 'm1', title: 'Module 1: Information Management Concepts and Fundamentals (Week 2)',
                    content: `
                        <h3>1.1 Overview and Definitions</h3>
                        <ul>
                            <li><strong>Information Management (IM):</strong> An umbrella term encompassing all the systems and processes within an organization for the creation, collection, management, preservation, storage, delivery, and use of corporate information.</li>
                            <li><strong>Purpose of IM:</strong> To design, develop, manage, and use information with insight and innovation, supporting sound decision-making and creating value.</li>
                            <li><strong>Database:</strong> A structured collection of data that is electronically stored and managed.</li>
                            <li><strong>Data vs. Information:</strong> <em>Data</em> is raw, unorganized facts (e.g., 123, "Juan"). <em>Information</em> is processed data organized with context and meaning.</li>
                            <li><strong>DBMS:</strong> Software designed to manage, store, organize, and retrieve data efficiently.</li>
                        </ul>
                        <h3>1.2 Historical Evolution of Databases</h3>
                        <ul>
                            <li><strong>1960s:</strong> Charles Bachman designed the first computerized database.</li>
                            <li><strong>1970s:</strong> Dr. E. F. Codd introduced the relational model.</li>
                            <li><strong>1980s:</strong> SQL became the standard database language.</li>
                            <li><strong>1990s:</strong> Emergence of Object-Oriented Databases.</li>
                            <li><strong>2000s to Present:</strong> Distributed, Cloud, and NoSQL databases.</li>
                        </ul>
                        <h3>1.3 File Systems vs. Database Systems</h3>
                        <h4>Disadvantages of Traditional File Systems:</h4>
                        <ol>
                            <li>Program-Data Dependence</li>
                            <li>Duplication of Data</li>
                            <li>Limited Data Sharing</li>
                            <li>Lengthy Development Times</li>
                            <li>Excessive Program Maintenance</li>
                        </ol>
                        <p><strong>Benefits of Database Systems:</strong> Centralized data management, improved consistency, simple data retrieval, enhanced security, and scalability.</p>
                        <h3>1.4 Five Components of a Database System</h3>
                        <ol>
                            <li><strong>Hardware:</strong> Physical devices.</li>
                            <li><strong>Software:</strong> OS, DBMS, and Application programs.</li>
                            <li><strong>People:</strong> System Admins, DBAs, Designers, Analysts, End Users.</li>
                            <li><strong>Procedures:</strong> Rules and guidelines.</li>
                            <li><strong>Data:</strong> The collection of facts.</li>
                        </ol>
                    `
                },
                {
                    id: 'm2', title: 'Module 2: Database System Concepts and Architecture (Weeks 3 & 4)',
                    content: `
                        <h3>2.1 DBMS Architectures</h3>
                        <ul>
                            <li><strong>Single-Tier:</strong> Client UI, logic, and DB on one machine.</li>
                            <li><strong>Two-Tier:</strong> Client connects over network to a server hosting the DB.</li>
                            <li><strong>Three-Tier:</strong> Client UI, Application Server (logic), and Database Server.</li>
                        </ul>
                        <h3>2.2 Three-Level Architecture (ANSI/SPARC Model)</h3>
                        <ol>
                            <li><strong>External Level (View):</strong> How users see the data.</li>
                            <li><strong>Conceptual Level (Logical):</strong> What data is stored and relationships.</li>
                            <li><strong>Internal Level (Physical):</strong> How data is physically stored.</li>
                        </ol>
                        <h3>2.4 Schemas vs. Instances</h3>
                        <ul>
                            <li><strong>Schema:</strong> The overall logical design or blueprint.</li>
                            <li><strong>Instance:</strong> The actual data stored at a particular moment.</li>
                        </ul>
                        <h3>2.5 Data Models & Data Independence</h3>
                        <ul>
                            <li><strong>Data Models:</strong> Relational, Semistructured, ER, Object-based.</li>
                            <li><strong>Logical Data Independence:</strong> Change conceptual schema without altering external schemas.</li>
                            <li><strong>Physical Data Independence:</strong> Change internal schema without altering conceptual schema.</li>
                        </ul>
                        <h3>2.6 DBMS Languages (SQL Classifications)</h3>
                        <ul>
                            <li><strong>DDL:</strong> CREATE, ALTER, DROP, TRUNCATE, RENAME, COMMENT.</li>
                            <li><strong>DML:</strong> SELECT, INSERT, UPDATE, DELETE, MERGE.</li>
                            <li><strong>DCL:</strong> GRANT, REVOKE.</li>
                            <li><strong>TCL:</strong> COMMIT, ROLLBACK, SAVEPOINT.</li>
                        </ul>
                    `
                },
                {
                    id: 'm3', title: 'Module 3: Entity-Relationship Diagram (ERD) (Week 5)',
                    content: `
                        <h3>3.1 Conceptual ER Model and Diagram Notations</h3>
                        <ul>
                            <li><strong>Rectangle:</strong> Entity</li>
                            <li><strong>Ellipse:</strong> Attribute</li>
                            <li><strong>Diamond:</strong> Relationship</li>
                            <li><strong>Underline:</strong> Primary Key</li>
                            <li><strong>Double Ellipse:</strong> Multi-valued attribute</li>
                            <li><strong>Dashed Ellipse:</strong> Derived attribute</li>
                        </ul>
                        <h3>3.2 Entities and Attribute Types</h3>
                        <ul>
                            <li><strong>Strong Entity:</strong> Has its own primary key.</li>
                            <li><strong>Weak Entity:</strong> Depends on another entity for identification.</li>
                            <li><strong>Simple, Composite, Derived, Single-Valued, Multi-Valued.</strong></li>
                        </ul>
                        <h3>3.3 Relationships and Cardinality</h3>
                        <ul>
                            <li><strong>1:1, 1:M, M:1, M:N</strong></li>
                            <li><strong>Crow's Foot:</strong> Mandatory One, Mandatory Many, Optional One, Optional Many.</li>
                        </ul>
                    `
                },
                {
                    id: 'm4', title: 'Module 4: Relational Data Model (Week 6)',
                    content: `
                        <h3>4.1 Fundamental Relational Concepts</h3>
                        <ul>
                            <li><strong>Origins:</strong> Dr. E. F. Codd.</li>
                            <li><strong>Relation, Tuple, Attribute, Degree, Cardinality.</strong></li>
                        </ul>
                        <h3>4.2 Relational Integrity Constraints</h3>
                        <ul>
                            <li><strong>Key Constraints:</strong> Primary key must be unique and not null.</li>
                            <li><strong>Domain Constraints:</strong> Values must be atomic from defined domain.</li>
                            <li><strong>Referential Integrity:</strong> Foreign key must exist in referenced PK or be null.</li>
                        </ul>
                        <h3>4.3 Types of Database Keys</h3>
                        <ul>
                            <li><strong>Super Key, Candidate Key, Primary Key, Foreign Key.</strong></li>
                        </ul>
                    `
                },
                {
                    id: 'm5', title: 'Module 5: Database Normalization (Weeks 7 & 8)',
                    content: `
                        <h3>5.1 Concepts and Goals of Normalization</h3>
                        <p>Eliminate redundant data and insertion, update, and deletion anomalies.</p>
                        <h3>5.2 Database Anomalies</h3>
                        <ul>
                            <li><strong>Insertion Anomaly:</strong> Cannot insert new data due to dependency.</li>
                            <li><strong>Update Anomaly:</strong> Updating one value requires modifying multiple tuples.</li>
                            <li><strong>Deletion Anomaly:</strong> Deleting one entity unintentionally removes another.</li>
                        </ul>
                        <h3>5.3 Dependency Theory</h3>
                        <ul>
                            <li><strong>Functional Dependency (FD):</strong> A → B</li>
                            <li><strong>Transitive Dependency:</strong> A → B and B → C = A → C</li>
                            <li><strong>Multi-Valued Dependency (MVD):</strong> A →→ B</li>
                        </ul>
                        <h3>5.4 Normal Forms Progression</h3>
                        <div class="table-container">
                            <table>
                                <thead><tr><th>Normal Form</th><th>Core Structural Requirement</th></tr></thead>
                                <tbody>
                                    <tr><td>1NF</td><td>Atomic domains, single-valued cells, uniquely identified rows.</td></tr>
                                    <tr><td>2NF</td><td>In 1NF; eliminates partial dependencies.</td></tr>
                                    <tr><td>3NF</td><td>In 2NF; eliminates transitive dependencies.</td></tr>
                                    <tr><td>BCNF</td><td>Stricter 3NF; for every dependency X → Y, X must be a superkey.</td></tr>
                                    <tr><td>4NF</td><td>In BCNF/3NF; eliminates multi-valued dependencies.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    `
                }

    function goHome() {
        homeScreen.classList.add('active');
        courseContent.style.display = 'none';
        backBtn.style.display = 'none';
        headerTitle.textContent = "QCU IT Study Hub";
        headerSubtitle.textContent = "Choose a course to begin";
        currentCourseKey = '';
        currentCourseData = null;

    function switchTab(tabId) {
        document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.content-area').forEach(area => area.classList.remove('active'));
        
        document.querySelector(`.nav-tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
        document.getElementById(tabId).classList.add('active');

        if (tabId === 'quiz') {
            resetQuizUI();
        }
    }

    // --- STUDY GUIDE LOGIC ---
    function renderModuleButtons() {
        moduleSelector.innerHTML = `<button class="module-btn active" onclick="filterModule('all', this)">All Modules</button>`;
        currentCourseData.modules.forEach(mod => {
            const shortTitle = mod.title.split(':')[0] + ': ' + mod.title.split(':')[1].split('(')[0].trim();
            moduleSelector.innerHTML += `<button class="module-btn" onclick="filterModule('${mod.id}', this)">${shortTitle}</button>`;
        });
    }

    function renderGuide(filter = 'all', searchTerm = '') {
        let html = '';

        currentCourseData.modules.forEach(module => {
            if (filter !== 'all' && module.id !== filter) return;

            if (searchTerm && !module.content.toLowerCase().includes(searchTerm.toLowerCase()) && !module.title.toLowerCase().includes(searchTerm.toLowerCase())) {
                return;
            }

            html += `<div class="guide-module" id="${module.id}">
                        <h2 style="color: var(--primary); margin-top: 20px;">${module.title}</h2>
                        ${module.content}
                    </div>`;
        });

        if (html === '') {
            html = '<p style="text-align: center; color: var(--text-light);">No results found.</p>';
        }

        studyContent.innerHTML = html;
    }

    function filterModule(moduleId, btn) {
        document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        searchInput.value = '';
        renderGuide(moduleId);

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

        currentQuizIndex = 0;
        quizScore = 0;
        isAnswered = false;

        quizSetup.style.display = 'none';
        quizResults.style.display = 'none';
        quizActive.style.display = 'block';

        loadQuizQuestion();
    }

    function loadQuizQuestion() {
        if (currentQuizIndex >= quizQuestionsShuffled.length) {
            showQuizResults();
            return;
        }

        const q = quizQuestionsShuffled[currentQuizIndex];
        const progress = (currentQuizIndex / quizQuestionsShuffled.length) * 100;
        
        quizProgressBar.style.width = `${progress}%`;
        quizScoreDisplay.textContent = `Score: ${quizScore}`;
        questionText.textContent = `Q${currentQuizIndex + 1}: ${q.q}`;
        
        optionsContainer.innerHTML = '';
        
        const shuffledAnswers = shuffleArray([...q.a]);
        
        shuffledAnswers.forEach(answer => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            btn.textContent = answer;
            btn.onclick = () => selectQuizAnswer(btn, answer, q.correct);
            optionsContainer.appendChild(btn);
        });

        quizFeedback.textContent = '';
        quizFeedback.className = 'quiz-feedback';
        nextBtn.disabled = true;
        nextBtn.textContent = (currentQuizIndex === quizQuestionsShuffled.length - 1) ? "See Results" : "Next Question";
        isAnswered = false;
    }

    function selectQuizAnswer(selectedBtn, selectedAnswer, correctAnswer) {
        if (isAnswered) return;
        isAnswered = true;

        const allBtns = document.querySelectorAll('#optionsContainer .option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        if (selectedAnswer === correctAnswer) {
            selectedBtn.classList.add('correct');
            quizFeedback.textContent = "Correct!";
            quizFeedback.classList.add('correct-text');
            quizScore++;
        } else {
            selectedBtn.classList.add('wrong');
            quizFeedback.textContent = `Incorrect. The correct answer is: ${correctAnswer}`;
            quizFeedback.classList.add('wrong-text');
            
            allBtns.forEach(btn => {
                if (btn.textContent === correctAnswer) {
                    btn.classList.add('correct');
                }
            });
        }

        quizScoreDisplay.textContent = `Score: ${quizScore}`;
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        currentQuizIndex++;
        loadQuizQuestion();
    }

    function showQuizResults() {
        quizActive.style.display = 'none';
        quizResults.style.display = 'block';
        
        finalScore.textContent = `${quizScore} / ${totalQuizItems}`;
        
        const percentage = (quizScore / totalQuizItems) * 100;
        let message = "";
        if (percentage === 100) message = "Perfect score! You are a master! 🏆";
        else if (percentage >= 80) message = "Excellent work! You have a strong grasp of the concepts. 🌟";
        else if (percentage >= 60) message = "Good job! A little more review and you'll ace it. 📚";
        else message = "Keep studying! Review the guide and try again. 💪";
        
        finalMessage.textContent = message;
    }

    function restartQuiz() {
        resetQuizUI();
    }
</script>
</body>
</html>
